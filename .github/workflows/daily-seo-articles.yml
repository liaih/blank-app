name: 每日 SEO 文章補稿
on:
  schedule:
    - cron: "45 10 * * *" # 18:45 Asia/Taipei
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-seo-articles.yml"
      - "scripts/replenish_seo_articles.py"
      - "tests/test_daily_seo_articles.py"

permissions:
  contents: write

concurrency:
  group: daily-seo-article-queue
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and verify article checks
        run: |
          python -m pip install beautifulsoup4==4.14.3 pytest
          python -m pytest -q tests/test_daily_seo_articles.py tests/test_floorplan_protection.py
      - name: Update public draft queue
        run: python -m scripts.replenish_seo_articles
      - name: Publish draft feed
        run: |
          git config user.name "seo-visibility-bot"
          git config user.email "seo-visibility-bot@users.noreply.github.com"
          git add docs/seo-daily-articles.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(seo): replenish daily article review queue"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
