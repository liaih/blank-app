name: Read-only Chen Yang homepage SEO audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_homepage_seo.py"
      - ".github/workflows/homepage-seo-audit.yml"
permissions:
  contents: write
concurrency:
  group: public-homepage-seo-observation
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet beautifulsoup4
      - name: Audit published homepage without changing production CMS
        run: python scripts/audit_homepage_seo.py
      - name: Validate source data, then publish read-only audit
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("docs/seo-homepage-audit.json").read_text())
          assert len(d["checks"])==4
          assert all(x["requested_url"].startswith("https://") for x in d["checks"])
          assert any(x.get("status")==200 and x.get("title") for x in d["checks"]), "No live homepage HTML inspected; refuse to publish"
          PY
          git config user.name "seo-homepage-audit-bot"
          git config user.email "seo-homepage-audit-bot@users.noreply.github.com"
          git add docs/seo-homepage-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "data: record real published homepage HTML and indexability audit"
            git push origin HEAD:main
          fi
