name: Preserve original CMS images and videos in SEO rewrites

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/preserve-seo-media.yml"
      - "scripts/preserve_seo_media.py"
      - "docs/seo-rewrites.json"
      - "docs/seo-improvement-plan.json"

permissions:
  contents: write

concurrency:
  group: public-seo-media-rewrites
  cancel-in-progress: false

jobs:
  extract_media:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTML parser only (no paid AI or scrape service)
        run: python -m pip install --quiet beautifulsoup4
      - name: Extract same-site media assets from original CMS pages
        run: python scripts/preserve_seo_media.py
      - name: Validate image URL preservation and nonempty ALT text
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlsplit
          from bs4 import BeautifulSoup
          doc=json.loads(Path("docs/seo-media-rewrites.json").read_text(encoding="utf-8"))
          assert len(doc["articles"])==8
          for article in doc["articles"]:
              assert article["media_count"]==len(article["media"])
              assert article["media_integrated"]==bool(article["media_count"] and article["html_with_media"])
              urls=[x["url"] for x in article["media"]]
              assert len(urls)==len(set(urls))
              assert all(urlsplit(url).scheme=="https" for url in urls)
              if not article["media_integrated"]:
                  continue
              soup=BeautifulSoup(article["html_with_media"],"html.parser")
              images=soup.find_all("img")
              originals=[x for x in article["media"] if x["type"]=="image"]
              assert len(images)==len(originals),(article["id"],"image count mismatch")
              assert all(img.get("alt","").strip() for img in images),(article["id"],"ALT missing")
              assert all(img.get("src")==source["url"] and
                  img.get("alt")==source["alt"] for img,source in zip(images,originals)),article["id"]
              assert article["alt_count"]==len(images)
              # Videos may be embedded iframes, HTML5 videos, or safe source links.
              video_count=sum(x["type"]=="video" for x in article["media"])
              published_video_count=len(soup.find_all(["video","iframe"]))+len([
                  a for a in soup.find_all("a") if "觀看原影片" in a.get_text()
              ])
              assert published_video_count>=video_count,(article["id"],"video missing")
          print("Validated all recovered media with descriptive ALT and preserved image URLs")
          PY
      - name: Publish public media manifest and merged HTML; no CMS mutations
        run: |
          git config user.name "seo-visibility-bot"
          git config user.email "seo-visibility-bot@users.noreply.github.com"
          git add docs/seo-media-rewrites.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh original article media and merged SEO HTML"
            git push origin HEAD:main
          fi
