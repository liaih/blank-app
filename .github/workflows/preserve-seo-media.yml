name: Preserve original CMS images and videos in SEO rewrites

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/preserve-seo-media.yml"
      - "scripts/preserve_seo_media.py"
      - "docs/seo-rewrites.json"
      - "docs/seo-improvement-plan.json"

permissions:
  contents: write

concurrency:
  group: public-seo-media-rewrites
  cancel-in-progress: false

jobs:
  extract_media:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTML parser only (no paid AI or scrape service)
        run: python -m pip install --quiet beautifulsoup4
      - name: Extract same-site media assets from original CMS pages
        run: python scripts/preserve_seo_media.py
      - name: Validate HTML and original source URL manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlsplit
          doc=json.loads(Path("docs/seo-media-rewrites.json").read_text(encoding="utf-8"))
          assert len(doc["articles"])==8
          for article in doc["articles"]:
              assert article["media_count"]==len(article["media"])
              assert article["media_integrated"]==bool(article["media_count"] and article["html_with_media"])
              urls=[x["url"] for x in article["media"]]
              assert len(urls)==len(set(urls))
              assert all(urlsplit(url).scheme=="https" for url in urls)
              if article["media_integrated"]:
                  assert all(url in article["html_with_media"] or
                         url.replace("https://www.youtube.com/watch?v=","https://www.youtube-nocookie.com/embed/") in article["html_with_media"]
                         for url in urls if "youtube.com/watch?v=" not in url)
          PY
      - name: Publish public media manifest and merged HTML; no CMS mutations
        run: |
          git config user.name "seo-visibility-bot"
          git config user.email "seo-visibility-bot@users.noreply.github.com"
          git add docs/seo-media-rewrites.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh original article media and merged SEO HTML"
            git push origin HEAD:main
          fi
