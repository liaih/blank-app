name: Preserve original CMS images and videos in SEO rewrites

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/preserve-seo-media.yml"
      - "scripts/preserve_seo_media.py"
      - "scripts/audit_source_html.py"
      - "docs/seo-rewrites.json"
      - "docs/seo-improvement-plan.json"

permissions:
  contents: write

concurrency:
  group: public-seo-media-rewrites
  cancel-in-progress: false

jobs:
  extract_media:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTML parser only (no paid AI or scrape service)
        run: python -m pip install --quiet beautifulsoup4 pytest
      - name: Regression-test immutable floorplans and article preservation
        run: python -m pytest -q tests/test_floorplan_protection.py
      - name: Extract same-site media assets from original CMS pages
        run: python scripts/preserve_seo_media.py
      - name: Audit existing page content containers without modifying originals
        run: python scripts/audit_source_html.py
      - name: Verify original article content, URLs and project-search facts are preserved
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlsplit
          from bs4 import BeautifulSoup
          report=json.loads(Path("docs/seo-media-rewrites.json").read_text(encoding="utf-8"))
          assert len(report["articles"])==8
          for row in report["articles"]:
              audit=row["preservation_audit"]
              assert audit["original_main_content_preserved"],(row["id"],audit.get("failure"))
              assert audit["floorplan_protection_passed"],(row["id"],"floorplan removed/reordered")
              assert row["floorplan_protection_passed"],row["id"]
              assert audit["floorplan_count"]==row["floorplan_count"],row["id"]
              assert len(audit["floorplan_urls"])==audit["floorplan_count"],row["id"]
              assert len(set(audit["floorplan_urls"]))==len(audit["floorplan_urls"]),row["id"]

              assert audit["source_has_building_information"],(row["id"],"no project information")
              assert row["media_integrated"] and row["html_with_media"],row["id"]
              assert audit["merged_text_characters"]>audit["original_text_characters"],row["id"]
              assert audit["original_image_urls_count"]==audit["preserved_image_urls_count"],row["id"]
              assert audit["original_link_count"]==audit["preserved_link_count"],row["id"]
              assert audit["original_video_count"]==audit["preserved_video_count"],row["id"]
              assert row["article_mode"] in ("existing_news","existing_unboxing")
              assert row["template"]=="chenyang-existing-article-v1.1"
              soup=BeautifulSoup(row["html_with_media"],"html.parser")
              assert not soup.find("h1"),(row["id"],"duplicate H1")
              assert not soup.find_all(["html","head","body","script"]),(row["id"],"dangerous element")
              assert "此為【" not in row["html_with_media"] and "此為 【" not in row["html_with_media"]
              imgs=soup.find_all("img")
              assert len(imgs)==audit["original_image_urls_count"],row["id"]
              assert all(img.get("alt","").strip() for img in imgs),(row["id"],"ALT missing")
              new_headings=[h for h in soup.find_all("h2") if "延伸閱讀" in h.get_text()]
              assert new_headings,(row["id"],"missing enrichment")
              for h in new_headings:
                  span=h.find("span")
                  assert span and "#C5A47E !important" in span.get("style","")
                  assert "font-size:20px !important" in span.get("style","")
              assert soup.select('span[style*="font-size:18px !important"]'),row["id"]
              # These are original sources, not guessed uploads.
              assert all(urlsplit(asset["url"]).scheme=="https" for asset in row["media"])
          print("PASS: 8 original project articles, photos/videos/links preserved; added CMS-safe SEO guidance")
          PY
      - name: Publish public media manifest and merged HTML; no CMS mutations
        run: |
          git config user.name "seo-visibility-bot"
          git config user.email "seo-visibility-bot@users.noreply.github.com"
          git add docs/seo-media-rewrites.json docs/seo-source-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh original article media and merged SEO HTML"
            git push origin HEAD:main
          fi
