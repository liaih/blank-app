name: SEO case-editor regression
on:
  push:
    branches: [main]
    paths:
      - docs/seo-case-expansion.js
      - docs/monitor.html
      - docs/native-ai-summary.json
      - tests/native-ai-answer-ux.mjs
      - docs/seo-improvement-plan.json
      - docs/seo-media-rewrites.json
      - docs/seo-rewrites.json
      - tests/seo-editor-regression.mjs
      - .github/workflows/seo-editor-regression.yml
  pull_request:
    paths:
      - docs/seo-case-expansion.js
      - docs/monitor.html
      - docs/native-ai-summary.json
      - tests/native-ai-answer-ux.mjs
      - docs/seo-improvement-plan.json
      - docs/seo-media-rewrites.json
      - docs/seo-rewrites.json
      - tests/seo-editor-regression.mjs
      - .github/workflows/seo-editor-regression.yml
permissions:
  contents: read
jobs:
  case-editor-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run source-backed article isolation and reload tests
        run: node --test tests/seo-editor-regression.mjs tests/native-ai-answer-ux.mjs
